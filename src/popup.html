<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Translate to Mandarin</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="mst-root">
  <main>
    <label for="input">Text to translate</label>
    <textarea id="input" rows="3" maxlength="1000" placeholder="Type or paste text"></textarea>
    <div class="row">
      <button id="translate" type="button">Translate</button>
      <label class="check"><input id="traditional" type="checkbox"> Traditional characters</label>
    </div>
    <div id="result" class="mst-card" hidden></div>
  </main>
  <script src="core.js"></script>
  <script src="translate.js"></script>
  <script src="panel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
